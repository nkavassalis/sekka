[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sekka"
version = "0.1.0"
description = "Sekka - a terminal (TUI) chat client for OpenAI-compatible LLM endpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.63",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sekka = "sekka.cli:main"

[tool.setuptools]
packages = ["sekka"]
